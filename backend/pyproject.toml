[project]
name = "data-agent"
version = "0.1.0"
description = "Secure Natural-Language Analytics and ETL Platform"

authors = [
    { name = "Yojith KR", email = "yojithkr@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.17",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "openai>=3.3.1",
    "pandas>=3.0.5",
    "psycopg2>=2.9.12",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
]


[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
